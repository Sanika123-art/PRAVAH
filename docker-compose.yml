
services:
  postgres:
    image: postgres:16-alpine3.22
    container_name: saksham_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saksham_db
    ports:
      - "5432:5432"
    volumes:
      - saksham_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saksham_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  saksham_pgdata:
    driver: local
