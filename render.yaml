services:
  # SAKSHAM / PRAVAH Backend API Service (and unified Fullstack Service)
  - type: web
    name: pravah-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_USER_PASSWORD
        value: AicteDev@2026!
      - key: ALLOWED_ORIGINS
        value: https://pravah-client.onrender.com,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: pravah-db
          property: connectionString

  # SAKSHAM / PRAVAH Frontend Static Site
  - type: web
    name: pravah-client
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: pravah-server
          property: host
          path: /api
      - key: VITE_ENABLE_MOCK_DATA
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: pravah-db
    plan: free
    region: oregon
    databaseName: saksham_db
    user: pravah_user
